<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug User Roles</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .log {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .log-entry {
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            border-left: 4px solid #ccc;
        }
        .log-info {
            background: #e3f2fd;
            border-left-color: #2196F3;
            color: #1565C0;
        }
        .log-success {
            background: #e8f5e9;
            border-left-color: #4CAF50;
            color: #2E7D32;
        }
        .log-error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }
        .log-warning {
            background: #fff3e0;
            border-left-color: #ff9800;
            color: #e65100;
        }
        .user-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .user-card h3 {
            margin-top: 0;
            color: #333;
        }
        .user-field {
            margin: 8px 0;
            padding: 5px;
            background: #f9f9f9;
            border-radius: 3px;
        }
        .user-field strong {
            color: #555;
            min-width: 120px;
            display: inline-block;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .role-validator {
            background: #e3f2fd;
            color: #1976d2;
        }
        .role-scholar {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        .role-admin {
            background: #ffebee;
            color: #c62828;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 User Roles Debugger</h1>
        <p class="subtitle">This tool will check all users in your Firebase and show their roles</p>
        
        <button id="checkBtn" onclick="checkAllUsers()">Check All Users</button>
        <button onclick="clearLog()">Clear Log</button>
        
        <div id="log" class="log"></div>
        <div id="users"></div>
    </div>

    <script type="module">
        // Firebase configuration
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyA-uLO9djFAxT0CG9cETSf-UiZNAqGm-4Q",
            authDomain: "scholarship-cloudbase.firebaseapp.com",
            projectId: "scholarship-cloudbase",
            storageBucket: "scholarship-cloudbase.firebasestorage.app",
            messagingSenderId: "316123000523",
            appId: "1:316123000523:web:45dbf9c1eb25a5ede4b54e",
            measurementId: "G-QW1PMQZMSZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.db = db;
        window.auth = auth;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        window.log = log;

        async function checkAllUsers() {
            const btn = document.getElementById('checkBtn');
            btn.disabled = true;
            const usersDiv = document.getElementById('users');
            usersDiv.innerHTML = '';
            
            log('🔍 Starting user check...', 'info');
            
            try {
                const usersRef = collection(db, 'users');
                const querySnapshot = await getDocs(usersRef);
                
                log(`✅ Found ${querySnapshot.size} users in database`, 'success');
                
                if (querySnapshot.empty) {
                    log('⚠️ No users found! Please run setup-test-accounts.html first', 'warning');
                    btn.disabled = false;
                    return;
                }
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    log(`📄 User ID: ${doc.id}`, 'info');
                    
                    // Create user card
                    const card = document.createElement('div');
                    card.className = 'user-card';
                    
                    const roleBadgeClass = 
                        data.role === 'validator' ? 'role-validator' :
                        data.role === 'scholar' ? 'role-scholar' :
                        data.role === 'admin' ? 'role-admin' : '';
                    
                    card.innerHTML = `
                        <h3>
                            ${data.fullName || data.name || 'Unknown User'}
                            <span class="role-badge ${roleBadgeClass}">${data.role || 'No Role'}</span>
                        </h3>
                        <div class="user-field"><strong>UID:</strong> ${doc.id}</div>
                        <div class="user-field"><strong>Email:</strong> ${data.email || 'N/A'}</div>
                        <div class="user-field"><strong>Role:</strong> ${data.role || 'NOT SET ⚠️'}</div>
                        <div class="user-field"><strong>Status:</strong> ${data.status || 'N/A'}</div>
                        ${data.department ? `<div class="user-field"><strong>Department:</strong> ${data.department}</div>` : ''}
                        ${data.position ? `<div class="user-field"><strong>Position:</strong> ${data.position}</div>` : ''}
                        ${data.course ? `<div class="user-field"><strong>Course:</strong> ${data.course}</div>` : ''}
                        ${data.yearLevel ? `<div class="user-field"><strong>Year Level:</strong> ${data.yearLevel}</div>` : ''}
                    `;
                    
                    usersDiv.appendChild(card);
                    
                    // Log role specifically
                    if (!data.role) {
                        log(`⚠️ WARNING: ${data.email || doc.id} has NO ROLE set!`, 'error');
                    } else {
                        log(`  → Role: ${data.role}`, 'success');
                    }
                });
                
                log('✅ Check complete!', 'success');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
            
            btn.disabled = false;
        }

        window.checkAllUsers = checkAllUsers;

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            document.getElementById('users').innerHTML = '';
        }

        window.clearLog = clearLog;

        // Auto-run on load
        log('✅ Debugger ready! Click "Check All Users" to see all user roles', 'info');
    </script>
</body>
</html>
