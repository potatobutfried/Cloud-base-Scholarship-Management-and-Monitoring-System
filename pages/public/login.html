<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GRC-MLALAF Scholarship</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'A            <!-- Admin Info -->
            <div class="admin-info">
                <div class="info-box">
                    <h4>� Test Accounts for Development</h4>
                    <p><strong>Validator:</strong> valjeremy / validator123<br>
                    <strong>Scholar:</strong> schojeremy / scholar123<br>
                    <small>These are for testing purposes. Need an account? Contact support.</small></p>
                    <p style="margin-top: 0.5rem; font-size: 0.85rem; color: #856404;">
                    <strong>⚠️ First time?</strong> Run <code>scripts/setup-test-accounts.html</code> to create these accounts in Firebase.</p>
                </div>
            </div>ns-serif;
            background: linear-gradient(135deg, #4A90E2 0%, #5BA3F5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 600px;
        }
        
        .auth-left {
            background: linear-gradient(135deg, #4A90E2 0%, #5BA3F5 100%);
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        
        .logo {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            border: 3px solid #FFD700;
        }
        
        .logo-text {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
        }
        
        .auth-left h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #FFD700;
        }
        
        .auth-left p {
            font-size: 1.1rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .auth-right {
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-header h3 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .auth-header p {
            color: #666;
            font-size: 1rem;
        }
        
        .auth-toggle {
            display: flex;
            background: #f0f0f0;
            border-radius: 25px;
            margin-bottom: 2rem;
            overflow: hidden;
        }
        
        .auth-toggle button {
            flex: 1;
            padding: 1rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            color: #666;
        }
        
        .auth-toggle button.active {
            background: #4A90E2;
            color: white;
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f9f9f9;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4A90E2;
            background: white;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }
        
        .password-toggle {
            position: relative;
        }
        
        .password-toggle button {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 1.2rem;
        }
        
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #4A90E2 0%, #5BA3F5 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(74, 144, 226, 0.3);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        

        
        .error-message {
            background: #ffe6e6;
            color: #d32f2f;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            border-left: 4px solid #d32f2f;
            display: none;
        }
        
        .success-message {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            border-left: 4px solid #2e7d32;
            display: none;
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 1rem;
        }
        
        .forgot-password a {
            color: #4A90E2;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .forgot-password a:hover {
            text-decoration: underline;
        }
        
        .back-to-home {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }
        
        .back-to-home:hover {
            color: #FFD700;
        }
        
        @media (max-width: 768px) {
            .auth-container {
                grid-template-columns: 1fr;
                max-width: 400px;
            }
            
            .auth-left {
                padding: 2rem;
            }
            
            .logo {
                width: 100px;
                height: 100px;
            }
            
            .auth-left h2 {
                font-size: 1.5rem;
            }
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-to-home">
        ← Back to Home
    </a>

    <div class="auth-container">
        <div class="auth-left">
            <div class="logo">
                <div class="logo-text">
                    GRC<br>
                    MLALAF<br>
                    Scholarship
                </div>
            </div>
            <h2>Welcome!</h2>
            <p>Join our scholarship community and unlock opportunities for your educational journey.</p>
        </div>
        
        <div class="auth-right">
            <div class="auth-header">
                <h3>Scholarship Portal Login</h3>
                <p>Sign in to access your dashboard</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <!-- Login Form -->
            <form class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email or Username</label>
                    <input type="text" id="loginEmail" placeholder="Enter your username" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-toggle">
                        <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" onclick="togglePassword('loginPassword')" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn" id="loginBtn">
                    Sign In
                </button>
                
                <div class="forgot-password">
                    <a href="#" id="forgotPasswordLink">Forgot your password?</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { 
            getAuth, 
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            signOut
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { 
            getFirestore, 
            doc, 
            getDoc 
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA-uLO9djFAxT0CG9cETSf-UiZNAqGm-4Q",
            authDomain: "scholarship-cloudbase.firebaseapp.com",
            projectId: "scholarship-cloudbase",
            storageBucket: "scholarship-cloudbase.firebasestorage.app",
            messagingSenderId: "316123000523",
            appId: "1:316123000523:web:45dbf9c1eb25a5ede4b54e",
            measurementId: "G-QW1PMQZMSZ"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loginBtn = document.getElementById('loginBtn');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');

        // Ensure login form is always active
        loginForm.classList.add('active');

        // Utility functions
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function clearMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        function setLoading(button, isLoading) {
            if (isLoading) {
                button.disabled = true;
                button.innerHTML = '<span class="loading"></span> Processing...';
            } else {
                button.disabled = false;
                button.textContent = 'Sign In';
            }
        }



        // Login form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();
            
            let email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            // Auto-append @grc.edu.ph if user only enters username
            if (!email.includes('@')) {
                email = email + '@grc.edu.ph';
            }
            
            setLoading(loginBtn, true);
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Get user data from Firestore to determine role
                const userDocRef = doc(db, 'users', user.uid);
                const userSnapshot = await getDoc(userDocRef);
                
                if (userSnapshot.exists()) {
                    const userData = userSnapshot.data();
                    const userRole = userData.role || 'scholar';
                    
                    // Store user info in sessionStorage
                    sessionStorage.setItem('userRole', userRole);
                    sessionStorage.setItem('userName', userData.fullName || userData.name || user.email);
                    sessionStorage.setItem('userEmail', user.email);
                    
                    // Route based on role - FIXED: Separate routing for admin, validator, and scholar
                    if (userRole === 'admin' || userRole === 'administrator') {
                        sessionStorage.setItem('userAdmin', true);
                        showSuccess('Welcome Admin! Redirecting...');
                        setTimeout(() => {
                            window.location.href = '../admin/admin.html';
                        }, 1000);
                    } else if (userRole === 'validator' || userRole === 'reviewer') {
                        sessionStorage.setItem('userAdmin', true);
                        showSuccess('Welcome Validator! Redirecting...');
                        setTimeout(() => {
                            window.location.href = '../admin/validator-new.html';
                        }, 1000);
                    } else if (userRole === 'scholar') {
                        showSuccess('Welcome Scholar! Redirecting...');
                        setTimeout(() => {
                            window.location.href = '../admin/scholar-dashboard.html';
                        }, 1000);
                    } else {
                        await signOut(auth);
                        throw new Error('Invalid account role. Please contact support.');
                    }
                } else {
                    sessionStorage.setItem('userRole', 'scholar');
                    sessionStorage.setItem('userName', user.email);
                    sessionStorage.setItem('userEmail', user.email);
                    showSuccess('Welcome! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '../admin/scholar-dashboard.html';
                    }, 1000);
                }
                
            } catch (error) {
                let errorMsg = 'Login failed. Please try again.';
                
                if (error.message && error.message.includes('Invalid account role')) {
                    errorMsg = '⚠️ Account Error: Your account role is not recognized. Please contact support.';
                } else {
                    switch (error.code) {
                        case 'auth/user-not-found':
                            errorMsg = 'No account found with this email address.';
                            break;
                        case 'auth/wrong-password':
                            errorMsg = 'Incorrect password. Please try again.';
                            break;
                        case 'auth/invalid-email':
                            errorMsg = 'Please enter a valid email address.';
                            break;
                        case 'auth/user-disabled':
                            errorMsg = 'This account has been disabled.';
                            break;
                        case 'auth/too-many-requests':
                            errorMsg = 'Too many failed attempts. Please try again later.';
                            break;
                        case 'auth/invalid-credential':
                            errorMsg = 'Invalid email or password. Please check your credentials.';
                            break;
                        default:
                            if (error.message) {
                                errorMsg = error.message;
                            }
                    }
                }
                
                showError(errorMsg);
            } finally {
                setLoading(loginBtn, false);
            }
        });





        // Forgot password
        forgotPasswordLink.addEventListener('click', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            
            if (!email) {
                showError('Please enter your email address first.');
                return;
            }
            
            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess('Password reset email sent! Please check your inbox.');
            } catch (error) {
                let errorMsg = 'Failed to send password reset email.';
                
                if (error.code === 'auth/user-not-found') {
                    errorMsg = 'No account found with this email address.';
                }
                
                showError(errorMsg);
            }
        });

        // Password toggle function
        window.togglePassword = function(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;
            
            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = '🙈';
            } else {
                input.type = 'password';
                button.textContent = '👁️';
            }
        };

        // Check if user is already logged in - redirect to appropriate dashboard
        auth.onAuthStateChanged(async (user) => {
            if (user && window.location.pathname.includes('login.html')) {
                try {
                    const userDocRef = doc(db, 'users', user.uid);
                    const userSnapshot = await getDoc(userDocRef);
                    
                    if (userSnapshot.exists()) {
                        const userData = userSnapshot.data();
                        const userRole = userData.role || 'scholar';
                        
                        if (userRole === 'admin' || userRole === 'administrator') {
                            window.location.href = '../admin/admin.html';
                        } else if (userRole === 'validator' || userRole === 'reviewer') {
                            window.location.href = '../admin/validator-new.html';
                        } else if (userRole === 'scholar') {
                            window.location.href = '../admin/scholar-dashboard.html';
                        } else {
                            window.location.href = '../admin/admin.html';
                        }
                    } else {
                        window.location.href = '../admin/scholar-dashboard.html';
                    }
                } catch (error) {
                    console.error('Error checking user role:', error);
                    window.location.href = '../admin/admin.html';
                }
            }
        });
    </script>
</body>
</html>
